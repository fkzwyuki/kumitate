<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>くみたてパズル</title>
<meta name="theme-color" content="#f6f4ef">
<!-- ホーム画面に追加したとき、アプリのように全画面で開く（manifest.webmanifest、DESIGN.md §8.5） -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="くみたてパズル">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* 1枚の canvas を、上=部屋・下=ランナーに分けて描く。ボタンや札はその上に浮かせる */
:root{
  --bg:#f6f4ef; --paper:#fbfbf8; --grid:#e3e6ea; --ink:#26303a;
  --label:#ffffff; --label-edge:#c9ced4; --badge:#e0743a; --badge-ink:#fff;
  --btn:#2f7fd1; --btn-ink:#fff; --hint:#2fb36d; --bar:#3b4048; --bar-thumb:#4fc3e8;
  --font:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#paper{position:absolute;left:0;right:0;bottom:0;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;z-index:2}
.btn{font:700 15px var(--font);border:0;border-radius:14px;padding:10px 14px;color:var(--btn-ink);background:var(--btn);
  box-shadow:0 4px 0 rgba(0,0,0,.22);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn:focus-visible{outline:3px solid var(--bar-thumb);outline-offset:2px}
#hintBtn{background:var(--hint)}
#hintBtn.nudge{animation:nudge 1s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
#resetBtn{background:#6d7681}
#topLeft{left:max(12px,env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px))}
#topRight{right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px))}
/* 名前の札と、付けた数。部屋とランナーの境目にまたがる */
#bar{left:50%;width:min(720px,calc(100% - 16px));display:flex;gap:8px;align-items:stretch;transform:translate(-50%,-50%);pointer-events:none}
.plate{background:var(--label);border:3px solid var(--label-edge);border-radius:10px;padding:6px 12px;font-weight:800;font-size:clamp(14px,4.2vw,20px);white-space:nowrap;min-width:0;
  display:flex;align-items:center;gap:10px;letter-spacing:.06em;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.plate .no{font-variant-numeric:tabular-nums;border-right:2px solid var(--label-edge);padding-right:12px}
#nameplate{flex:1.6}
#count{flex:1;background:var(--badge);color:var(--badge-ink);border-color:#b9551f;justify-content:space-between;font-variant-numeric:tabular-nums}
/* ランナーのどこを見ているかのバー */
#scroll{left:10px;right:10px;height:10px;border-radius:5px;background:var(--bar);pointer-events:none}
#thumb{position:absolute;top:2px;bottom:2px;border-radius:4px;background:var(--bar-thumb)}
#toast{left:50%;transform:translateX(-50%);background:rgba(20,26,32,.82);color:#fff;font-weight:800;font-size:20px;padding:10px 18px;border-radius:999px;
  pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.show{opacity:1}
/* 「はずす」ボタンと、入れ忘れの吹き出し：部屋の右下（名前の札の上）。吹き出しはボタンの左に出す */
#undoArea{right:max(12px,env(safe-area-inset-right,0px));top:calc(var(--roomh,55%) - 34px);transform:translateY(-100%);
  display:flex;align-items:flex-end;gap:12px;pointer-events:none;max-width:calc(100% - 24px)}
#undoBtn{pointer-events:auto;flex:none;min-width:66px;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 10px 7px;background:#5c7a99;line-height:1.1}
#undoBtn .ic{font-size:26px;font-weight:700;line-height:1}
#undoBtn .tx{font-size:13px;letter-spacing:.04em}
#undoBtn:disabled{opacity:.4;box-shadow:0 2px 0 rgba(0,0,0,.18);cursor:default}
#undoBtn:disabled:active{transform:none}
#undoBtn.glow{animation:undoGlow var(--undo-glow-sec,1.8s) ease-in-out infinite}
@keyframes undoGlow{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.22),0 0 0 0 rgba(255,214,77,0)}50%{box-shadow:0 4px 0 rgba(0,0,0,.22),0 0 0 7px rgba(255,214,77,.75)}}
#undoBtn.hinted{animation:undoHint .5s ease-in-out infinite;background:#4a8bd0}
@keyframes undoHint{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.22),0 0 0 3px rgba(255,214,77,.95)}50%{box-shadow:0 4px 0 rgba(0,0,0,.22),0 0 0 12px rgba(255,214,77,.55)}}
/* 入れ忘れの吹き出し（クリーム色・箱の絵つき。やさしい見た目） */
#forgot{position:relative;display:flex;align-items:center;gap:8px;max-width:min(270px,calc(100vw - 130px));padding:8px 14px 8px 10px;
  background:#fff3d4;color:#6b4a1e;border:3px solid #eacb8a;border-radius:18px;box-shadow:0 3px 0 rgba(0,0,0,.12);
  font-weight:800;font-size:clamp(14px,3.9vw,17px);line-height:1.35;letter-spacing:.03em;
  opacity:0;transform:translateY(8px) scale(calc(var(--forgot-scale,1) * .9));transition:opacity .25s,transform .25s;transform-origin:100% 100%}
#forgot::after{content:"";position:absolute;right:-13px;bottom:14px;border:9px solid transparent;border-left:12px solid #eacb8a;border-right:0}
#forgot::before{content:"";position:absolute;right:-8px;bottom:16px;border:7px solid transparent;border-left:9px solid #fff3d4;border-right:0;z-index:1}
#forgot .l{display:inline-block}
#forgot svg{flex:none;width:36px;height:36px}
#forgot.show{opacity:1;transform:scale(var(--forgot-scale,1));animation:forgotWobble var(--forgot-shake-sec,2.4s) ease-in-out .25s infinite}
@keyframes forgotWobble{0%,100%{transform:scale(var(--forgot-scale,1)) rotate(0)}30%{transform:scale(var(--forgot-scale,1)) rotate(calc(var(--forgot-deg,2.5deg) * -1))}70%{transform:scale(var(--forgot-scale,1)) rotate(var(--forgot-deg,2.5deg))}}
/* できた！：文字は部屋の上、ボタンは部屋の下 */
#done{left:0;right:0;top:0;height:var(--roomh,55%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding-top:calc(64px + env(safe-area-inset-top,0px));padding-bottom:28px;box-sizing:border-box;pointer-events:none}
#done h1{margin:0;font-size:clamp(34px,9vw,64px);color:#fff;-webkit-text-stroke:2px #c4482a;text-shadow:0 5px 0 #c4482a;letter-spacing:.1em}
#done .row{display:flex;gap:10px;pointer-events:auto}
/* 横長の画面（タブレット）では、ボタンが左右のすみにあるので、文字をもっと上に置ける */
@media (min-aspect-ratio: 1/1){#done{padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:36px}#done h1{font-size:clamp(34px,min(9vw,9vh),64px)}}
@media (prefers-reduced-motion: reduce){#hintBtn.nudge{animation:none}#forgot.show{animation:none}#undoBtn.glow,#undoBtn.hinted{animation:none;box-shadow:0 4px 0 rgba(0,0,0,.22),0 0 0 6px rgba(255,214,77,.85)}}
#play{position:absolute;inset:0}
#backBtn{background:#6d7681}
#done .row{flex-wrap:wrap;justify-content:center}
#toAlbumBtn{background:#e0743a}
/* はじめの画面（ずかん） */
#album{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;
  background:radial-gradient(circle at 20% 0,#fff8e6 0,transparent 55%),var(--bg);box-sizing:border-box;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#album h1{margin:6px 0 16px;text-align:center;font-size:clamp(28px,7.5vw,44px);letter-spacing:.12em;color:#2e5a86;text-shadow:0 3px 0 #fff,0 5px 0 rgba(46,90,134,.18)}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px;max-width:980px;margin:0 auto}
.card{font:inherit;color:inherit;text-align:left;cursor:pointer;touch-action:manipulation;background:#fff;border:3px solid var(--label-edge);border-radius:20px;padding:8px 8px 10px;
  box-shadow:0 5px 0 rgba(0,0,0,.13);display:flex;flex-direction:column;gap:4px;min-width:0}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.13)}
.card:focus-visible{outline:3px solid var(--bar-thumb);outline-offset:2px}
.card.done{border-color:#f0b94a;background:#fffdf5}
.card .art{aspect-ratio:1;border-radius:14px;background:radial-gradient(ellipse 60% 14% at 50% 82%,rgba(0,0,0,.10),transparent 70%),linear-gradient(#e9f4fb,#fbfbf8);overflow:hidden}
.card .art{position:relative}
.card .art canvas{position:static;width:100%;height:100%;display:block}
.card .meta{display:flex;flex-direction:column;padding:0 4px;min-width:0;line-height:1.25}
.card .no{font-size:13px;font-weight:800;color:#8a929b;white-space:nowrap}
.card .nm{font-size:clamp(16px,4.4vw,19px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:0 4px;min-height:24px}
.card .stars{color:#e0a82e;font-size:16px;letter-spacing:.05em}
.card .medal{font-size:14px;font-weight:800;color:#a8620f;background:#fff0c7;border-radius:999px;padding:1px 9px;white-space:nowrap}
#gear{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3;width:52px;height:52px;border-radius:50%;border:0;
  background:rgba(109,118,129,.55);color:#fff;font-size:26px;line-height:1;cursor:pointer;touch-action:manipulation;transition:transform .2s,background .2s}
#gear.holding{background:#d1453b;transform:scale(1.18)}
#gearHint{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:3;background:rgba(20,26,32,.85);color:#fff;font-weight:700;font-size:14px;
  padding:8px 12px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#gearHint.show{opacity:1}
/* きろくを けす（ページの中の確認。confirm() は使わない）*/
#erase{position:fixed;inset:0;z-index:5;background:rgba(20,26,32,.55);display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
#erase .box{background:#fff;border-radius:20px;padding:20px 22px;max-width:360px;width:100%;box-shadow:0 8px 0 rgba(0,0,0,.2);text-align:center}
#erase .big{margin:0 0 8px;font-size:22px;font-weight:800}
#erase .sub{margin:0 0 16px;font-size:14px;line-height:1.6;color:#4a5560}
#erase .row{display:flex;gap:10px;justify-content:center}
#eraseYes{background:#d1453b}
#eraseNo{background:#6d7681}
</style>
</head>
<body>
<div id="app">
  <!-- はじめの画面（ずかん） -->
  <div id="album" hidden>
    <h1>くみたてパズル</h1>
    <div id="cards"></div>
  <button id="gear" type="button" aria-label="おとなよう（ながおし）">⚙</button>
  <div id="gearHint">おとなの ひとは ながおし してね</div>
  <div id="erase" hidden role="dialog" aria-modal="true" aria-labelledby="eraseTitle">
    <div class="box">
      <p class="big" id="eraseTitle">きろくを けしますか？</p>
      <p class="sub">つくった ⭐ と かいすうが ぜんぶ きえます。もとには もどせません。</p>
      <div class="row"><button class="btn" id="eraseNo" type="button">やめる</button><button class="btn" id="eraseYes" type="button">けす</button></div>
    </div>
  </div>
  </div>

  <!-- 組み立ての画面 -->
  <div id="play" hidden>
    <div id="paper"></div>
    <canvas id="cv"></canvas>
    <div class="hud" id="topLeft"><button class="btn" id="backBtn">もどる</button></div>
    <div class="hud" id="topRight"><button class="btn" id="hintBtn">ヒント</button></div>
    <div class="hud" id="bar">
      <div class="plate" id="nameplate"><span class="no">No.</span><span></span></div>
      <div class="plate" id="count"><span>パーツ</span><span id="countNum">0/0</span></div>
    </div>
    <div class="hud" id="scroll"><div id="thumb"></div></div>
    <div class="hud" id="toast"></div>
    <!-- 入れ忘れの吹き出し（箱の絵つき）と「はずす」ボタン -->
    <div class="hud" id="undoArea">
      <div id="forgot" role="status" aria-live="polite">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <path d="M5 15 L20 9 L35 15 L35 31 L20 37 L5 31Z" fill="#efc07c" stroke="#b9854a" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M5 15 L20 21 L35 15" fill="#f7d9a4" stroke="#b9854a" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M20 21 V37" stroke="#b9854a" stroke-width="2.2"/>
          <path d="M5 15 L12 5 L20 9 M35 15 L28 5 L20 9" fill="#f7d9a4" stroke="#b9854a" stroke-width="2.2" stroke-linejoin="round"/>
        </svg>
        <span><span class="l">なにか いれわすれた</span> <span class="l">ぶひんが あるみたい！</span></span>
      </div>
      <button class="btn" id="undoBtn" type="button" aria-label="はずす" disabled><span class="ic">↶</span><span class="tx">はずす</span></button>
    </div>
    <div class="hud" id="done" hidden>
      <h1>できた！</h1>
      <div class="row"><button class="btn" id="againBtn">もういっかい</button><button class="btn" id="toAlbumBtn">ずかんへ</button></div>
    </div>
  </div>
</div>

<!-- 3D は同梱した Three.js 0.160.0 だけを使う（外のサイトからは何も読み込まない）-->
<script type="importmap">
{"imports":{
  "three":"./vendor/three/three.module.min.js?v=6250ca2",

}}
</script>

  if (navigator.serviceWorker && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</body>
</html>
